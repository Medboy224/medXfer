name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      # .gitattributes forces LF in *.go, so gofmt gives the same answer on every OS.
      - shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Fichiers à formater avec gofmt :"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go vet -tags "diag devui" ./...
      - run: go test ./...
      # Development build: fault injection (faultconn, faultfs, DEV-10) and the web dashboard
      # (devui, DEV-19). The plain "go test" above covers the production build.
      - run: go test -tags "diag devui" ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go test -race -tags "diag devui" ./...
      # No faultconn, faultfs, testkit, pprof or dashboard in the production binary
      # (DEV-10, DEV-12, DEV-19).
      - shell: bash
        run: bash scripts/check-prod-binary.sh
