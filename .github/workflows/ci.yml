name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      # Linux only: Windows runners check out with CRLF line endings, which gofmt reports.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Fichiers à formater avec gofmt :"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./pkg/...
      - if: matrix.os == 'ubuntu-latest'
        run: go test -race ./pkg/...
