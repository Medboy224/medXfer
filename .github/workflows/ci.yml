name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      # .gitattributes forces LF in *.go, so gofmt gives the same answer on every OS.
      - shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Fichiers à formater avec gofmt :"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go vet -tags diag ./...
      - run: go test ./...
      # Development build: fault injection (faultconn, faultfs, DEV-10). The plain "go test"
      # above covers the production build.
      - run: go test -tags diag ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go test -race -tags diag ./...
      # The C library of the Flutter app (cmd/libmedxfer, WP-6.4): built, then its five
      # functions called through the real C boundary (B1, B4, B9).
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/build-lib.sh --smoke
      # No faultconn, faultfs, testkit, pprof or dashboard in the production binary
      # (DEV-10, DEV-12, DEV-19).
      - shell: bash
        run: bash scripts/check-prod-binary.sh

  # The Flutter app (J6b, WP-B.1): analysis, tests on the fake core (DEV-17) and on the real
  # core through dart:ffi, then the Linux build with the core in its bundle.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2.9.1
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: bash scripts/build-lib.sh && bash scripts/stage-app-native.sh
        working-directory: .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - run: test -f build/linux/x64/release/bundle/lib/libmedxfer.so

  # WP-B.6: the Linux package, built on the oldest Ubuntu still supported so that its glibc
  # (2.35) suits Ubuntu 22.04, Debian 12 and the distributions built on them (WP-B.8). Then on
  # fresh systems with only the packages its DEPENDANCES.txt lists (G2A-08, reserve 2 of G2a),
  # and kept 14 days for the real tests.
  package-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2.9.1
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang-15 cmake ninja-build pkg-config libgtk-3-dev
      # Clang 15, not the default 14: zxing's C++20 ranges do not compile with clang 14 and
      # libstdc++ 12. The libstdc++ stays that of 22.04, so the package runs there.
      - run: |
          mkdir -p "$HOME/clang15"
          ln -s /usr/bin/clang-15 "$HOME/clang15/clang"
          ln -s /usr/bin/clang++-15 "$HOME/clang15/clang++"
          echo "$HOME/clang15" >> "$GITHUB_PATH"
      - run: bash scripts/package-linux.sh dist
      - run: bash scripts/test-fresh-linux.sh dist/medxfer-*-linux-x64.tar.gz ubuntu:22.04
      - run: bash scripts/test-fresh-linux.sh dist/medxfer-*-linux-x64.tar.gz ubuntu:24.04
      - uses: actions/upload-artifact@v7
        with:
          name: medxfer-linux-x64
          path: dist/medxfer-*-linux-x64.tar.gz
          retention-days: 14
